# golangci-lint configuration for Hermes project
# See: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

output:
  formats:
    text:
      path: stdout
      colors: true

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unconvert

  settings:
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment
        - buildtag

    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1020", "-SA1029"]

  exclusions:
    paths:
      - vendor
      - node_modules
      - web
      - ".*\\.pb\\.go$"
      - ".*_gen\\.go$"
    rules:
      - path: _test\.go
        linters:
          - staticcheck

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true

    goimports:
      local-prefixes:
        - github.com/hashicorp-forge/hermes

  exclusions:
    paths:
      - vendor
      - node_modules
      - web

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
