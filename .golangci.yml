# golangci-lint configuration for Hermes project
# See: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

output:
  formats:
    text:
      path: stdout
      colors: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - gocognit
    - goconst
    - gocritic
    - misspell
    - revive
    - unparam
    - unconvert
    - gosec
    - dupl
    - prealloc

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment

    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    goconst:
      min-len: 3
      min-occurrences: 3

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - unnamedResult
        - hugeParam

    misspell:
      locale: US

    revive:
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    staticcheck:
      checks: ["all"]

    unparam:
      check-exported: false

  exclusions:
    paths:
      - vendor
      - node_modules
      - web
      - ".*\\.pb\\.go$"
      - ".*_gen\\.go$"
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit
          - errcheck
          - dupl
          - gosec
          - goconst
          - prealloc

      - path: (.*)?_gen\.go
        linters:
          - gocyclo
          - gocognit

      - text: "G404:"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true

    goimports:
      local-prefixes:
        - github.com/hashicorp-forge/hermes

  exclusions:
    paths:
      - vendor
      - node_modules
      - web

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
