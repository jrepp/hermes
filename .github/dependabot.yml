# Dependency updates.
#
# Grouped aggressively on purpose. Ungrouped, the eight ecosystems below open
# a pull request per dependency per week, and a queue nobody reads is the same
# as no updates at all. Patch and minor bumps arrive as one pull request per
# ecosystem; majors stay separate because they are the ones worth reading.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, web]
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tests/e2e-playwright
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, test]
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      e2e-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /hermes-plugin
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, plugin]
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      plugin-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /python-client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, python]
    commit-message:
      prefix: build(deps)
    groups:
      python-client-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /testing/python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, python, test]
    commit-message:
      prefix: build(deps)
    groups:
      testing-python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images. The integration and e2e suites run against these, so a bump
  # here is covered by the same jobs that cover application code.
  - package-ecosystem: docker
    directories:
      - /
      - /web
      - /testing
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    commit-message:
      prefix: build(deps)
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Action versions are the one dependency CI cannot test by running itself
  # against an older copy: whatever lands here is what every other job runs on.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: ci(deps)
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
