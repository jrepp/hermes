name: PR Validation

# Deliberately its own workflow, with no path filter.
#
# Parallel CI skips entirely for documentation-only changes, so any check
# living there is skipped with it. Commit messages are not a property of which
# files changed: a docs-only pull request can carry a message that fails the
# same rules, and under the old arrangement nothing would have looked.
on:
  pull_request:

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every commit in the pull request is checked against the same script the
  # commit-msg hook runs.
  #
  # The hook is configured in .pre-commit-config.yaml and `make install-hooks`
  # did not install that hook type, so the check was written, committed, and
  # dead; thirty-four commits landed carrying trailers the script rejects. A
  # hook only guards whoever installed it. This guards the branch.
  commit-messages:
    name: Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The whole range between base and head has to be present to walk it.
          fetch-depth: 0

      - name: Check every commit in the pull request
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          count=0
          failed=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            count=$((count + 1))
            git log -1 --format=%B "$sha" > /tmp/commit-msg.txt
            if ! ./scripts/check-commit-msg.sh /tmp/commit-msg.txt; then
              echo "::error::$(git log -1 --format='%h %s' "$sha")"
              failed=1
            fi
          done < <(git rev-list "$base..$head")

          # A pull request with no commits in range means the base and head
          # were resolved wrongly, and reporting success for that would be a
          # check that passes by looking at nothing.
          if [ "$count" -eq 0 ]; then
            echo "::error::no commits found between $base and $head"
            exit 1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::$count commit(s) checked, one or more rejected"
            exit 1
          fi
          echo "✅ $count commit message(s) pass"

  # A pull request that changes dependencies without the lockfile, or the
  # reverse, does not build the way CI thinks it does.
  go-mod-tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify go mod tidy leaves nothing to do
        run: |
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy
          if ! diff -q /tmp/go.mod.before go.mod > /dev/null || \
             ! diff -q /tmp/go.sum.before go.sum > /dev/null; then
            echo "::error::go.mod or go.sum is not tidy; run 'go mod tidy' and commit the result"
            diff -u /tmp/go.mod.before go.mod || true
            diff -u /tmp/go.sum.before go.sum || true
            exit 1
          fi
          echo "✅ go.mod and go.sum are tidy"

      - name: Verify dependencies are downloadable and verified
        run: go mod verify

  # The Mergify configuration is not YAML-checked by anything else, and being
  # valid YAML is not the same as being a valid configuration: a condition
  # containing ": " parses as a mapping rather than a string, loads without
  # complaint, and is rejected by Mergify's schema. That shipped once already.
  mergify-config:
    name: Mergify config is valid
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install the Mergify CLI
        run: curl -fsSL https://raw.githubusercontent.com/Mergifyio/mergify-cli/main/install.sh | sh

      - name: Validate .mergify.yml
        run: mergify config validate --config-file .mergify.yml
