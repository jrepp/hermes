name: Parallel CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'docs-demo/**'
      - 'docs-internal/**'
      - '**/*.md'
      - '.github/workflows/docs*.yml'
  # No branch filter. A pull request targeting anything other than main --
  # which is every pull request in a stack, since each targets its parent --
  # ran no CI at all under `branches: [main]`. The point of stacking is that
  # each step is reviewable, and a step nothing tested is not.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'docs-demo/**'
      - 'docs-internal/**'
      - '**/*.md'
      - '.github/workflows/docs*.yml'

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Detect changes to determine what to run
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-go-tests: ${{ steps.changes.outputs.run-go-tests }}
      run-web-tests: ${{ steps.changes.outputs.run-web-tests }}
      run-python-tests: ${{ steps.changes.outputs.run-python-tests }}
      run-integration-tests: ${{ steps.changes.outputs.run-integration-tests }}
      run-e2e-tests: ${{ steps.changes.outputs.run-e2e-tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        run: |
          # Get the base ref for comparison
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_REF="${{ github.event.before }}"
          else
            BASE_REF="origin/main"
          fi

          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only "$BASE_REF" HEAD || echo "")

          # Determine what needs to run
          RUN_GO_TESTS="false"
          RUN_WEB_TESTS="false"
          RUN_PYTHON_TESTS="false"
          RUN_INTEGRATION_TESTS="false"
          RUN_E2E_TESTS="false"

          # Check for Go code changes.
          #
          # Workflow files are in this list because a change to CI is not
          # validated by anything else. A pull request touching only
          # .github/workflows ran no jobs at all and reported success: the
          # change-detection step found nothing to test, every job skipped,
          # and the status gate treats skipped as passed. A workflow edit
          # breaking every job would have gone green.
          if echo "$CHANGED_FILES" | grep -qE '(\.go$|go\.mod|go\.sum|Makefile|\.golangci\.yml|^\.github/workflows/)'; then
            RUN_GO_TESTS="true"
          fi

          # Check for web changes
          if echo "$CHANGED_FILES" | grep -qE '^web/'; then
            RUN_WEB_TESTS="true"
          fi

          # Check for Python client changes
          if echo "$CHANGED_FILES" | grep -qE '^python-client/'; then
            RUN_PYTHON_TESTS="true"
          fi

          # Check for testing infrastructure changes
          if echo "$CHANGED_FILES" | grep -qE '^testing/'; then
            RUN_INTEGRATION_TESTS="true"
            RUN_E2E_TESTS="true"
          fi

          # Check for API/internal changes that affect integration
          if echo "$CHANGED_FILES" | grep -qE '^(internal/|pkg/|cmd/)'; then
            RUN_INTEGRATION_TESTS="true"
          fi

          # Force run all tests if no base ref available
          if [ -z "$CHANGED_FILES" ]; then
            RUN_GO_TESTS="true"
            RUN_WEB_TESTS="true"
            RUN_PYTHON_TESTS="true"
            RUN_INTEGRATION_TESTS="true"
            RUN_E2E_TESTS="true"
          fi

          # Output results
          {
            echo "run-go-tests=${RUN_GO_TESTS}"
            echo "run-web-tests=${RUN_WEB_TESTS}"
            echo "run-python-tests=${RUN_PYTHON_TESTS}"
            echo "run-integration-tests=${RUN_INTEGRATION_TESTS}"
            echo "run-e2e-tests=${RUN_E2E_TESTS}"
          } >> "$GITHUB_OUTPUT"

          # Display summary
          {
            echo "## 📋 CI Execution Plan"
            echo ""
            echo "| Component | Status |"
            echo "|-----------|--------|"
            echo "| Go Tests | $([ "$RUN_GO_TESTS" = "true" ] && echo "✅ Will run" || echo "⏭️ Skipped") |"
            echo "| Web Tests | $([ "$RUN_WEB_TESTS" = "true" ] && echo "✅ Will run" || echo "⏭️ Skipped") |"
            echo "| Python Tests | $([ "$RUN_PYTHON_TESTS" = "true" ] && echo "✅ Will run" || echo "⏭️ Skipped") |"
            echo "| Integration Tests | $([ "$RUN_INTEGRATION_TESTS" = "true" ] && echo "✅ Will run" || echo "⏭️ Skipped") |"
            echo "| E2E Tests | $([ "$RUN_E2E_TESTS" = "true" ] && echo "✅ Will run" || echo "⏭️ Skipped") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Job 2: Lint Go code in parallel by category
  lint-go:
    name: Lint Go (${{ matrix.category }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.run-go-tests == 'true'

    strategy:
      fail-fast: false
      matrix:
        category: [format, vet, golangci-lint, complexity, search-direct-writes]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Download Go modules
        run: go mod download

      - name: Create placeholder web/dist for go:embed
        run: mkdir -p web/dist && echo "placeholder" > web/dist/index.html

      # The version lives in the Makefile so local and CI cannot drift. They
      # were pinned separately before, with a comment asking whoever changed
      # one to remember the other.
      - name: Resolve golangci-lint version
        if: matrix.category == 'golangci-lint'
        id: golangci-version
        run: |
          version="$(sed -n 's/^GOLANGCI_LINT_VERSION ?= //p' Makefile)"
          test -n "$version" || { echo "GOLANGCI_LINT_VERSION not found in Makefile" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The version is part of the cache key. Without it a bump reinstalls
      # nothing: the cache hits on the old binary and the new pin has no
      # effect at all.
      - name: Cache golangci-lint binary
        if: matrix.category == 'golangci-lint'
        id: cache-golangci-lint
        uses: actions/cache@v5
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ steps.golangci-version.outputs.version }}

      # go install rather than the upstream install.sh.
      #
      # That script is fetched from master while a version is pinned, and the
      # two disagreed: installing v2.13.1 failed with a checksum mismatch
      # because the script verifies against a list that does not correspond to
      # the tag being installed. go install resolves through the module proxy
      # and verifies against go.sum semantics, so the version asked for is the
      # version that arrives.
      - name: Install golangci-lint
        if: matrix.category == 'golangci-lint' && steps.cache-golangci-lint.outputs.cache-hit != 'true'
        run: |
          env GOFLAGS= go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ steps.golangci-version.outputs.version }}"

      # Pinned, not @latest. These tools decide whether a PR passes, so an
      # upstream release that changes what they count would fail PRs that
      # changed nothing -- and the failure would appear to come from the PR.
      - name: Install complexity tools
        if: matrix.category == 'complexity'
        run: |
          env GOFLAGS= go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          env GOFLAGS= go install github.com/uudashr/gocognit/cmd/gocognit@v1.2.1

      - name: Run format check
        if: matrix.category == 'format'
        run: |
          echo "Checking Go code formatting..."
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not properly formatted:"
            echo "$unformatted"
            exit 1
          fi
          echo "✅ All Go files are properly formatted"

      - name: Run go vet
        if: matrix.category == 'vet'
        run: |
          echo "Running go vet..."
          go vet ./...

          # Everything behind the integration tag is invisible to the run
          # above, which is most of the test suites. Two of them cannot run in
          # CI at all, so this is the only thing standing between them and
          # silent rot.
          echo "Running go vet (integration build tag)..."
          go vet -tags=integration ./...

      - name: Run golangci-lint
        if: matrix.category == 'golangci-lint'
        run: |
          echo "Running golangci-lint..."
          golangci-lint run --timeout=5m

      - name: Run complexity check
        if: matrix.category == 'complexity'
        run: |
          echo "Running complexity analysis..."
          ./scripts/check-complexity.sh

      - name: Run search direct-write guard
        if: matrix.category == 'search-direct-writes'
        run: |
          echo "Checking for unapproved direct search writes..."
          ./scripts/check-search-direct-writes.sh

  # Job 3: Build Go binaries
  build-go:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-go

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false


      - name: Download Go modules
        run: go mod download

      - name: Create placeholder web/dist for go:embed
        run: mkdir -p web/dist && echo "placeholder" > web/dist/index.html

      - name: Build all binaries
        run: make build-binaries

      - name: Upload Go binaries
        uses: actions/upload-artifact@v7
        with:
          name: go-binaries
          path: build/bin/*
          retention-days: 7

  # Job 4: Test Go packages in parallel
  test-go:
    name: Test Go (${{ matrix.package.path }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.run-go-tests == 'true'

    strategy:
      fail-fast: false
      matrix:
        package:
          - path: internal/api/v2
            coverage-name: internal-api-v2
          - path: internal/auth
            coverage-name: internal-auth
          - path: internal/config
            coverage-name: internal-config
          - path: internal/db
            coverage-name: internal-db
          - path: internal/indexer
            coverage-name: internal-indexer
          - path: internal/notifier
            coverage-name: internal-notifier
          - path: internal/server
            coverage-name: internal-server
          - path: pkg
            coverage-name: pkg
          - path: cmd
            coverage-name: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false


      - name: Download Go modules
        run: go mod download

      - name: Create placeholder web/dist for go:embed
        run: mkdir -p web/dist && echo "placeholder" > web/dist/index.html

      - name: Run tests with coverage
        run: |
          if [ -d "${{ matrix.package.path }}" ]; then
            cd ${{ matrix.package.path }}
            go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
            if [ -f coverage.out ]; then
              go tool cover -func=coverage.out | grep total | awk '{print "Coverage: " $3}'
            fi
          else
            echo "Package directory not found, skipping"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.package.coverage-name }}-${{ github.run_id }}
          path: ${{ matrix.package.path }}/coverage.out
          retention-days: 7
          if-no-files-found: ignore

  # Job 5: Build and test web
  test-web:
    name: Test Web Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.run-web-tests == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Set yarn version
        run: make web/set-yarn-version
        env:
          SKIP_YARN_COREPACK_CHECK: true
          YARN_IGNORE_NODE: 1

      - name: Build web
        run: make web/build

      - name: Run web tests
        run: make web/test

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/dist/
          retention-days: 7

  # Job 6: Test Python client
  test-python:
    name: Test Python Client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.run-python-tests == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd python-client
          pip install -e .
          pip install pytest pytest-cov

      - name: Run Python tests
        run: |
          cd python-client
          pytest tests/ --cov=. --cov-report=xml

      - name: Upload Python coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python
          path: python-client/coverage.xml
          retention-days: 7

  # Job 7: Integration tests
  test-integration:
    name: Integration Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes, build-go]
    if: needs.detect-changes.outputs.run-integration-tests == 'true'

    strategy:
      fail-fast: false
      matrix:
        suite:
          - api
          # The e2e and migration suites are deliberately absent. It does not use
          # testcontainers like the others: it expects the testing/
          # docker-compose stack already up. Between them they want central
          # Hermes on :8000, edge on :8002, meilisearch on :7701, mailhog,
          # redpanda, a postgres on a fixed localhost:5433 with migrations
          # already applied, and a list of containers they find by grepping
          # `docker ps`. Neither had ever passed here: e2e ran no tests at
          # all, and migration failed on its first prerequisite.
          #
          # Nothing is lost by leaving them out, because neither was running.
          # go vet runs over the integration tag so both keep compiling.
          # Restoring them means giving them the self-contained setup the
          # other suites have, not adding services here.

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false


      - name: Download Go modules
        run: go mod download

      - name: Download Go binaries
        uses: actions/download-artifact@v8
        with:
          name: go-binaries
          path: build/bin/

      - name: Make binaries executable
        run: chmod +x build/bin/*

      # Every suite is behind the integration build tag, so every suite is run
      # with it. Two were not: the e2e suite ran `go test ./...` with no tag
      # and matched no packages, and the api suite compiled only the files
      # that carry no tag. A suite that runs nothing reports whatever the
      # shell last returned, which is not a statement about the code.
      #
      # The package list is resolved before the run and an empty list is a
      # failure. That is the check that would have caught the e2e job, and it
      # catches the next suite whose directory is renamed or whose tag is
      # changed.
      - name: Resolve packages - ${{ matrix.suite }}
        id: suite
        run: |
          case "${{ matrix.suite }}" in
            # tags is empty for api on purpose. Building that suite with the
            # integration tag compiles ~40 tests that CI has never compiled,
            # and they do not pass: a nil Google Workspace provider panics
            # two draft handlers, several endpoints answer 500 where the test
            # expects 200, a delete leaves the row behind, and some
            # assertions predate the JSON content type the handlers now send.
            # None of that is caused by this branch and none of it is a
            # toolchain question, so it is quarantined rather than fixed here
            # or hidden with continue-on-error.
            #
            # This is a narrower gap than the one it replaces: it is written
            # down, and `go vet -tags=integration ./...` still compiles every
            # one of those tests, so they cannot rot while they wait.
            api) pkgs=./tests/api/... timeout=15m tags= ;;
            *)
              echo "unknown suite '${{ matrix.suite }}'" >&2
              echo "Add it to this case statement or drop it from the matrix." >&2
              exit 1
              ;;
          esac

          found="$(go list -tags="$tags" "$pkgs" 2>/dev/null || true)"
          if [ -z "$found" ]; then
            echo "suite '${{ matrix.suite }}' matched no packages under $pkgs" >&2
            echo "Nothing would have been tested, so this is a failure and not a pass." >&2
            exit 1
          fi
          echo "Testing:"
          echo "$found" | while read -r pkg; do echo "  $pkg"; done

          {
            echo "pkgs=$pkgs"
            echo "timeout=$timeout"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - name: Run integration tests - ${{ matrix.suite }}
        run: |
          go test -tags="${{ steps.suite.outputs.tags }}" -v \
            -timeout="${{ steps.suite.outputs.timeout }}" \
            "${{ steps.suite.outputs.pkgs }}"

  # Job 8: E2E Playwright tests
  test-e2e-playwright:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [detect-changes, build-go, test-web]
    if: needs.detect-changes.outputs.run-e2e-tests == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install E2E dependencies
        run: |
          cd testing/python
          pip install -e ../../python-client
          pip install -e .
          pip install httpx pydantic-settings eval-type-backport

      - name: Start testing environment
        run: |
          mkdir -p web/dist && echo "placeholder" > web/dist/index.html
          cd testing
          docker compose up -d postgres meilisearch dex migrate hermes-central hermes-indexer

      - name: Wait for services
        run: |
          echo "Waiting for Hermes backend..."
          timeout 120 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'
          echo "✅ Services ready"

      - name: Run E2E tests
        run: |
          cd testing/python
          PYTHONPATH=../../python-client/src:. python3 scenario_automated.py --skip-auth-check
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: |
          cd testing
          docker compose down -v

  # Job 9: Coverage summary
  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-go, test-web, test-python, test-integration]
    if: always()

    steps:
      - name: Download all coverage reports
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-reports/

      - name: Display coverage summary
        run: |
          {
            echo "## 📊 Coverage Summary"
            echo ""
            echo "| Component | Status |"
            echo "|-----------|--------|"
            for dir in coverage-reports/*/; do
              component=$(basename "$dir" | sed 's/^coverage-//')
              if [ -f "$dir/coverage.out" ] || [ -f "$dir/coverage.xml" ]; then
                echo "| $component | ✅ Present |"
              else
                echo "| $component | ⚠️ Missing |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Job 10: Parallel CI status check (required for merge)
  parallel-ci-status:
    name: Parallel CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - detect-changes
      - lint-go
      - build-go
      - test-go
      - test-web
      - test-python
      - test-integration
      - test-e2e-playwright
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          # Function to check if a job passed (success or skipped)
          check_job() {
            local result="$1"
            [[ "$result" == "success" ]] || [[ "$result" == "skipped" ]]
          }

          FAILED=false

          # Check required jobs
          if ! check_job "${{ needs.detect-changes.result }}"; then
            echo "❌ detect-changes failed"
            FAILED=true
          fi

          if ! check_job "${{ needs.lint-go.result }}"; then
            echo "❌ lint-go failed"
            FAILED=true
          fi

          if ! check_job "${{ needs.build-go.result }}"; then
            echo "❌ build-go failed"
            FAILED=true
          fi

          if ! check_job "${{ needs.test-go.result }}"; then
            echo "❌ test-go failed"
            FAILED=true
          fi

          if ! check_job "${{ needs.test-web.result }}"; then
            echo "❌ test-web failed"
            FAILED=true
          fi

          if ! check_job "${{ needs.test-python.result }}"; then
            echo "❌ test-python failed"
            FAILED=true
          fi

          if ! check_job "${{ needs.test-integration.result }}"; then
            echo "❌ test-integration failed"
            FAILED=true
          fi

          if ! check_job "${{ needs.test-e2e-playwright.result }}"; then
            echo "❌ test-e2e-playwright failed"
            FAILED=true
          fi

          if [ "$FAILED" = true ]; then
            echo "❌ Parallel CI pipeline failed"
            exit 1
          else
            echo "✅ Parallel CI pipeline passed"
          fi
